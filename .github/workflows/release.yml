name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: ddtcorex/dsh-maestro-ci/.github/workflows/node-release.yml@7acac89da2ba99457f8b4edfc683ce621ecacc21
    with:
      pnpm-version: ""
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
